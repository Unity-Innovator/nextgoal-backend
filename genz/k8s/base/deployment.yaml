apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextgoal-backend
  labels:
    app: nextgoal-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextgoal-backend
  template:
    metadata:
      labels:
        app: nextgoal-backend
    spec:
      containers:
        - name: nextgoal-backend
          image: genz-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: nextgoal-config
            - secretRef:
                name: nextgoal-secret
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx768m -XX:MaxRAMPercentage=70"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 80
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3 