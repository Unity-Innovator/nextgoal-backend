apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: nextgoal
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nextgoal-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextgoal-secret
                  key: SPRING_DATASOURCE_PASSWORD
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db # <--- THIS MATCHES THE "db" HOSTNAME IN YOUR URL
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: db