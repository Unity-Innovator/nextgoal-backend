apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextgoal-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: nextgoal.local   # overridden per-environment
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextgoal-backend
                port:
                  number: 80