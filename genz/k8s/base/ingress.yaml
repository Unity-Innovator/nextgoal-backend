apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextgoal-ingress

spec:
  rules:
    - host: nextgoal.local   # overridden per-environment
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextgoal-backend
                port:
                  number: 80