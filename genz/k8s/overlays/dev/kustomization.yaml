apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextgoal-dev
resources:
  - ../../base
patches:
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml
secretGenerator:
  - name: nextgoal-secret
    behavior: replace
    envs:
      - secret.env
images:
  - name: savemate-backend
    newTag: dev