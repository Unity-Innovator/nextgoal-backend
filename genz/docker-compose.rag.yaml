# Use with docker-compose.yml (local) or docker-compose.prod.yaml (deployment).
# Existing databases must remain on PostgreSQL major version 17.
services:
  db:
    image: pgvector/pgvector:pg17
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod,rag
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the deployment environment}
      ASSISTANT_RAG_MODEL: ${ASSISTANT_RAG_MODEL:-gpt-5.6-luna}
