spring:
  application:
    name: genz

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nextgoal}
    username: ${SPRING_DATASOURCE_USERNAME:nextgoal}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  sql:
    init:
      mode: always
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    defer-datasource-initialization: true
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
otp:
  expiration-minutes: 5
  max-attempts: 5
  resend-cooldown-seconds: 60
  length: 6
  console-delivery-enabled: ${OTP_CONSOLE_DELIVERY_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  seed:
    test-user-enabled: ${TEST_USER_SEED_ENABLED:false}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*}
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "health,info"

  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
