spring:
  application:
    name: genz

  data:
    redis:
      repositories:
        enabled: false
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nextgoal}
    username: ${SPRING_DATASOURCE_USERNAME:nextgoal}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  sql:
    init:
      mode: always
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    defer-datasource-initialization: true
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
otp:
  secret: ${OTP_SECRET:}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  seed:
    test-user-enabled: ${TEST_USER_SEED_ENABLED:false}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*}
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "health,info"

  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

supabase:
  url: ${SUPABASE_URL}
  secret-key: ${SUPABASE_SECRET_KEY}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET}

servlet:
  multipart:
    max-file-size: 40MB
    max-request-size: 42MB

plasgate:
  base-url: https://cloudapi.plasgate.com
  private-key: ${PLASGATE_PRIVATE_KEY:}
  secret-key: ${PLASGATE_SECRET_KEY:}
  sender: ${PLASGATE_SENDER:}
