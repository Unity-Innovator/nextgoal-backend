spring:
  application:
    name: genz

  data:
    redis:
      repositories:
        enabled: false
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s

  datasource:
  secret: 52656d656d62657220746f206d616b6520737572652074686973206973206174206c65617374203235362062697473206c6f6e67
  expiration: 86400000

otp:
  expiration-minutes: 5
  max-attempts: 5
  resend-cooldown-seconds: 60
  length: 6

plasgate:
  base-url: ${PLASGATE_BASE_URL:https://cloudapi.plasgate.com}
  private-key: ${PLASGATE_PRIVATE_KEY:}
  secret-key: ${PLASGATE_SECRET_KEY:}
  sender: ${PLASGATE_SENDER:}

