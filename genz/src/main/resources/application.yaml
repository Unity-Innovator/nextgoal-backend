spring:
  application:
    name: genz

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
otp:
  expiration-minutes: 5
  max-attempts: 5
  resend-cooldown-seconds: 60
  length: 6

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true