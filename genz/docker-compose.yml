services:
  postgres:
    image: postgres:17
    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: Chea Teng
      POSTGRES_PASSWORD: teng1234

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: