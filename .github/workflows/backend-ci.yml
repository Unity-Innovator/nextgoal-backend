name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Ubuntu after tests and build (default branch only)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: genz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: genz/pom.xml
      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: genz/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

  build_image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Docker image
        working-directory: genz
        env:
          IMAGE_TAG: genz-backend:${{ github.sha }}
        run: docker build --pull --tag "$IMAGE_TAG" .

  deploy_ubuntu:
    needs: build_image
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.deploy &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, ubuntu-deploy]
    timeout-minutes: 30
    environment:
      name: production/ubuntu
    concurrency:
      group: production-ubuntu
      cancel-in-progress: false
    defaults:
      run:
        working-directory: genz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment prerequisites
        run: |
          test -r /etc/default/nextgoal-env || { echo 'Runner cannot read /etc/default/nextgoal-env'; exit 1; }
          docker info > /dev/null
          docker compose version
      - name: Deploy backend
        run: >-
          docker compose
          --project-name nextgoal
          --env-file /etc/default/nextgoal-env
          -f docker-compose.prod.yaml
          up -d --build backend
      - name: Show deployment status
        run: >-
          docker compose
          --project-name nextgoal
          --env-file /etc/default/nextgoal-env
          -f docker-compose.prod.yaml
          ps
