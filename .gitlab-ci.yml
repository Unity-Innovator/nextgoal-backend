stages:
  - test
  - build
  - deploy

variables:
  APP_DIR: genz
  MAVEN_USER_HOME: "$CI_PROJECT_DIR/.m2"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

cache:
  key:
    files:
      - genz/pom.xml
  paths:
    - .m2/repository/

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd "$APP_DIR"
    - chmod +x mvnw
    - ./mvnw -B test
  artifacts:
    when: always
    reports:
      junit:
        - genz/target/surefire-reports/TEST-*.xml
    paths:
      - genz/target/surefire-reports/
    expire_in: 1 week

build_image:
  stage: build
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  needs:
    - test
  script:
    - cd "$APP_DIR"
    - docker build --pull --tag "genz-backend:$CI_COMMIT_SHA" .

deploy_ubuntu:
  stage: deploy
  image: alpine:3.20
  needs:
    - build_image
  before_script:
    - apk add --no-cache openssh-client
    - test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is not configured" && exit 1)
    - test -n "$SSH_KNOWN_HOSTS" || (echo "SSH_KNOWN_HOSTS is not configured" && exit 1)
    - test -n "$DEPLOY_HOST" || (echo "DEPLOY_HOST is not configured" && exit 1)
    - test -n "$DEPLOY_USER" || (echo "DEPLOY_USER is not configured" && exit 1)
    - test -n "$DEPLOY_PATH" || (echo "DEPLOY_PATH is not configured" && exit 1)
    - install -m 700 -d ~/.ssh
    - >-
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519;
      else
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519;
      fi
    - chmod 600 ~/.ssh/id_ed25519
    - >-
      if [ -f "$SSH_KNOWN_HOSTS" ]; then
        cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts;
      else
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts;
      fi
  script:
    - >-
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "cd '$DEPLOY_PATH' &&
      git pull --ff-only origin '$CI_DEFAULT_BRANCH' &&
      docker compose --env-file /etc/default/nextgoal-env
      -f docker-compose.prod.yaml up -d --build backend &&
      docker compose --env-file /etc/default/nextgoal-env
      -f docker-compose.prod.yaml ps"
  environment:
    name: production/ubuntu
  resource_group: production-ubuntu
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - when: never
