stages:
  - test
  - build
  - deploy

variables:
  APP_DIR: genz
  MAVEN_USER_HOME: "$CI_PROJECT_DIR/.m2"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key:
    files:
      - genz/pom.xml
  paths:
    - .m2/repository/

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd "$APP_DIR"
    - chmod +x mvnw
    - ./mvnw -B test
  artifacts:
    when: always
    reports:
      junit:
        - genz/target/surefire-reports/TEST-*.xml
    paths:
      - genz/target/surefire-reports/
    expire_in: 1 week

build_image:
  stage: build
  image: docker:27.5.1-cli
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
  services:
    - name: docker:27.5.1-dind
      alias: docker
  needs:
    - test
  script:
    - cd "$APP_DIR"
    - docker build --pull --tag "genz-backend:$CI_COMMIT_SHA" .

deploy_ubuntu:
  stage: deploy
  tags:
    - ubuntu-deploy
  needs:
    - build_image
  script:
    - cd "$CI_PROJECT_DIR/genz"
    - >-
      docker compose
      --env-file /etc/default/nextgoal-env
      -f docker-compose.prod.yaml
      up -d --build backend
    - >-
      docker compose
      --env-file /etc/default/nextgoal-env
      -f docker-compose.prod.yaml
      ps
  environment:
    name: production/ubuntu
  resource_group: production-ubuntu
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: manual
      allow_failure: true
    - when: never
